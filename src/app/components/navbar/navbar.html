<header class="sticky top-0 z-50 border-b border-line bg-bg/90 backdrop-blur-sm">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-6 py-4">
        <a routerLink="/" class="flex flex-col items-end leading-tight">
            <span class="flex items-center gap-1.5 text-xl font-extrabold text-ink">
                عدسة
                <svg class="h-6 w-6 text-accent" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.4" />
                    <path d="M20 6c6 4 10 8 8 14-2 6-8 8-14 6" stroke="currentColor" stroke-width="1.4" />
                </svg>
            </span>
            <span class="text-xs text-accent">عالم التصوير الفوتوغرافي</span>
        </a>

        <nav class="flex items-center gap-2">
            <a routerLink="/" routerLinkActive="bg-accent text-bg" [routerLinkActiveOptions]="{ exact: true }"
                class="rounded-full px-4 py-2 text-sm text-ink-muted transition-colors hover:text-ink">الرئيسية</a>
            <a routerLink="/articles" routerLinkActive="bg-accent text-bg"
                class="rounded-full px-4 py-2 text-sm text-ink-muted transition-colors hover:text-ink">المدونة</a>
            <a routerLink="/about" routerLinkActive="bg-accent text-bg"
                class="rounded-full px-4 py-2 text-sm text-ink-muted transition-colors hover:text-ink">من نحن</a>
        </nav>

        <div class="flex items-center gap-4">
            <button type="button" class="text-ink-muted hover:text-ink" aria-label="بحث">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
            </button>
            <a routerLink="/articles"
                class="rounded-full bg-accent px-5 py-2 text-sm font-bold text-bg transition-colors hover:bg-accent-tint">ابدأ
                القراءة</a>
        </div>
    </div>
</header>
